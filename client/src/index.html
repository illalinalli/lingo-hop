<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LingoHop</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe9">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Telegram Mini App bridge. Must load before the app so initData is available on bootstrap. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    // Runtime configuration, so one build can be deployed to any environment.
    // Leave apiBaseUrl empty to call the API on the same origin (recommended: nginx
    // serves the app and proxies /api to Kestrel).
    window.lingoHopConfig = { apiBaseUrl: '' };
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
